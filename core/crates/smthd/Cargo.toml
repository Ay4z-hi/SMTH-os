[package]
name = "smthd"
description = "SMTH OS service supervisor and IPC daemon."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
smth-core = { path = "../smth-core" }
serde.workspace = true
serde_json.workspace = true

[lib]
name = "smthd"
path = "src/lib.rs"

[[bin]]
name = "smthd"
path = "src/bin/smthd.rs"

[[bin]]
name = "smthctl-core"
path = "src/bin/smthctl_core.rs"
