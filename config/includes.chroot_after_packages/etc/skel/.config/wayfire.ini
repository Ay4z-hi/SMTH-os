[core]
plugins = alpha animate autostart blur command decoration expo fast-switcher grid gtk-shell idle move place resize scale switcher vswitch wayfire-shell wm-actions
preferred_decoration_mode = server
close_top_view = <alt> KEY_F4
xwayland = true

[blur]
mode = normal
method = kawase
kawase_degrade = 2
kawase_iterations = 3
kawase_offset = 4
brightness = 0.88
saturation = 1.18

[decoration]
active_color = 0.035 0.035 0.045 0.78
inactive_color = 0.035 0.035 0.045 0.66
border_size = 1
title_height = 32
button_order = minimize maximize close
font = Space Mono 10

[animate]
open_animation = zoom
close_animation = fade
duration = 220
zoom_duration = 220

[move]
activate = <super> BTN_LEFT

[resize]
activate = <super> BTN_RIGHT

[grid]
slot_l = <super> KEY_LEFT
slot_r = <super> KEY_RIGHT
slot_t = <super> KEY_UP

[scale]
toggle = <super> KEY_TAB

[expo]
toggle = <super> KEY_W

[vswitch]
binding_left = <ctrl> <super> KEY_LEFT
binding_right = <ctrl> <super> KEY_RIGHT
binding_up = <ctrl> <super> KEY_UP
binding_down = <ctrl> <super> KEY_DOWN

[command]
binding_terminal = <super> KEY_ENTER
command_terminal = alacritty
binding_launcher = <super> KEY_SPACE
command_launcher = smth-launcher
binding_search = <super> KEY_D
command_search = fuzzel
binding_files = <super> KEY_E
command_files = smth-files
binding_settings = <super> KEY_I
command_settings = smth-settings
binding_lock = <super> KEY_L
command_lock = smth-lock
binding_close = <alt> KEY_F4

[window-rules]
smth_glass = on created if type is "toplevel" then set alpha 0.88
smth_dialog_glass = on created if type is "dialog" then set alpha 0.92

[autostart]
services = sh -c '(smthd --config /etc/smth/services.json --palette /usr/local/lib/smth/palette.json || { smth-notifd & smth-moded & }) >/dev/null 2>&1'
mode = smth-mode auto
desktop = sh -c '(smth-home || swaybg -m fill -i /usr/share/backgrounds/smth/wallpaper.png) >/dev/null 2>&1'
construction = timeout 15 smth-startup
idle = swayidle -w timeout 300 'smth-lock' before-sleep 'smth-lock'
