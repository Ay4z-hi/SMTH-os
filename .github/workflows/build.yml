name: Build SMTH OS
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
jobs:
  iso:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }   # native ARM runner, no emulation
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build ISO (${{ matrix.arch }})
        run: SMTH_ARCH=${{ matrix.arch }} bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: smth-os-${{ matrix.arch }}
          path: out/*
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: iso
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: dist/* }
