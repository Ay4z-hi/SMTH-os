name: Build SMTH OS

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: smth-os-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    name: ISO (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }   # native ARM runner, no emulation
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    container:
      # Public mirror of the Docker Hub library image: anonymous pulls of
      # debian:trixie on shared runners get rate limited, which killed the job
      # during container start-up before any step ran.
      image: public.ecr.aws/docker/library/debian:trixie
      options: --privileged
    steps:
      # The debian image has no git, so checkout cannot run inside it yet.
      - name: Prepare container (git for checkout)
        shell: bash
        run: |
          set +e
          log=/tmp/prep.log
          : > "$log"
          apt-get update >> "$log" 2>&1
          update_status=$?
          apt-get install -y --no-install-recommends git ca-certificates >> "$log" 2>&1
          install_status=$?
          cat "$log"
          echo "apt-get update exit: $update_status, install exit: $install_status"
          if [ $update_status -ne 0 ] || [ $install_status -ne 0 ]; then
            # Annotations are readable without an account, raw logs are not.
            detail=$(tail -c 2500 "$log" | tr '\n' ' ' | tr -s ' ')
            detail=${detail//\%/pct}
            echo "::error title=Container preparation failed::update=$update_status install=$install_status :: $detail"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Build ISO (${{ matrix.arch }})
        shell: bash
        run: |
          set +e
          SMTH_ARCH=${{ matrix.arch }} bash scripts/build.sh 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            # Keep the END of the log: the failing command is the last thing logged.
            # The raw tail is full of carriage returns and percents, which mangles
            # annotations, so report the stage markers instead.
            stages=$(tr -d '\r' < /tmp/build.log | grep -a '^STAGE:' | tail -6 | tr '\n' ';' | tr -s ' ')
            # Raw logs require an account even for public repositories; put the
            # end of the log in the annotation so the failure is diagnosable.
            tail_detail=$(tr -d '\r' < /tmp/build.log | tail -c 3000 | tr '\n' ' ' | tr -s ' ')
            tail_detail=${tail_detail//\%/pct}
            echo "::error title=ISO build failed (${{ matrix.arch }}) exit $status::last stages: $stages || log tail: $tail_detail"
            if [ -f /tmp/build.log ]; then
              cp /tmp/build.log "/tmp/build-${{ matrix.arch }}.log" || true
            fi
            exit $status
          fi
      - name: Keep the build log when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.arch }}
          path: /tmp/build-${{ matrix.arch }}.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify ISO and checksum
        run: |
          set -euo pipefail
          ISO=out/smth-os-${{ matrix.arch }}.iso
          test -s "$ISO"
          test "$(stat -c%s "$ISO")" -gt 100000000
          ( cd out && sha256sum -c SHA256SUMS )
      - name: Report ISO size
        run: |
          ISO=out/smth-os-${{ matrix.arch }}.iso
          bytes=$(stat -c%s "$ISO")
          echo "::notice title=ISO size (${{ matrix.arch }})::$bytes bytes ($(du -h "$ISO" | cut -f1))"
      - uses: actions/upload-artifact@v4
        with:
          name: smth-os-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  boot:
    name: Boot ISO (${{ matrix.arch }})
    needs: iso
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: smth-os-${{ matrix.arch }}
          path: dist
      - name: Install QEMU and ISO tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso qemu-system-x86 qemu-system-arm
      - name: Verify El Torito, menu entries and kernel/initrd paths
        run: |
          set +e
          bash tools/verify_bootloader.sh "dist/smth-os-${{ matrix.arch }}.iso" "${{ matrix.arch }}" 2>&1 | tee /tmp/verify.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "::error title=verify_bootloader failed::$(tr '\n' ' ' < /tmp/verify.log | tail -c 1800)"
          fi
          exit $status
      - name: Boot the live image and verify the desktop session
        env:
          SMTH_QEMU_LOG: ${{ github.workspace }}/qemu-${{ matrix.arch }}.log
        run: |
          set +e
          bash tools/qemu_boot_test.sh "dist/smth-os-${{ matrix.arch }}.iso" "${{ matrix.arch }}" 2>&1 | tee /tmp/boot.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "::error title=qemu boot failed::$(grep -a 'SMTH_BOOT' /tmp/boot.log | tail -20 | tr '\n' '; ')"
          fi
          exit $status
      - name: Keep the serial boot log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: boot-log-${{ matrix.arch }}
          path: qemu-${{ matrix.arch }}.log
          if-no-files-found: ignore
          retention-days: 7

  extension:
    name: Firmware extension (test-signed)
    # Builds the real firmware extension from the Trixie archive with an
    # ephemeral key. This verifies the builder and the verifier without
    # touching the production signing key or publishing an artifact.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: public.ecr.aws/docker/library/debian:trixie
      options: --privileged
    steps:
      - name: Prepare container
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates debootstrap squashfs-tools openssl \
            debian-archive-keyring python3
      - uses: actions/checkout@v4
      - name: Build the firmware extension with a test key
        shell: bash
        run: |
          set +e
          (
            set -e
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/ext.key
            openssl rsa -in /tmp/ext.key -pubout -out /tmp/ext.pub
            python3 tools/build_extension.py firmware --arch amd64 \
              --private-key /tmp/ext.key --out /tmp/ext
            ls -lh /tmp/ext
          ) > /tmp/ext.log 2>&1
          status=$?
          cat /tmp/ext.log
          if [ "$status" -ne 0 ]; then
            {
              echo "### Firmware extension build failed (exit $status)"
              echo '```'
              tail -c 6000 /tmp/ext.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            detail=$(tr -d '\r' < /tmp/ext.log | grep -aE 'E:|error|Error|Traceback|Exception|not found|No such' | tail -4 | tr '\n' ';' | tr -s ' ')
            detail=${detail//\%/pct}
            [ -n "$detail" ] || detail=$(tail -c 500 /tmp/ext.log | tr '\n' ' ' | tr -s ' ')
            echo "::error title=Firmware extension build failed::exit $status :: $detail"
            exit "$status"
          fi
      - name: Report extension build failure
        if: failure()
        shell: bash
        run: |
          echo "summary path: ${GITHUB_STEP_SUMMARY:-unset}"
          if [ -f /tmp/ext.log ]; then
            wc -c /tmp/ext.log
            cat /tmp/ext.log
            {
              echo '### Firmware extension build failed'
              echo '```'
              tail -c 6000 /tmp/ext.log
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            msg=$(grep -a -B30 'Traceback (most recent call last)' /tmp/ext.log | tail -30 | tr '\n' ' ' | tr -d '\r')
            [ -n "$msg" ] || msg=$(tail -c 3000 /tmp/ext.log | tr '\n' ' ' | tr -d '\r')
            msg=$(printf '%s' "$msg" | tr -s ' ')
            msg=${msg//\%/pct}
            msg=${msg//::/:}
            echo "::error title=Extension build failed::${msg}"
          else
            echo "::error title=Extension build failed::/tmp/ext.log was not created"
          fi

      - name: Verify the extension with smthctl and inspect the payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.machinery, importlib.util, pathlib, subprocess, zipfile

          smx = next(pathlib.Path("/tmp/ext").glob("firmware-amd64.smx"))
          loader = importlib.machinery.SourceFileLoader(
              "smthctl_under_test",
              "config/includes.chroot_after_packages/usr/local/bin/smthctl",
          )
          spec = importlib.util.spec_from_loader(loader.name, loader)
          mod = importlib.util.module_from_spec(spec)
          loader.exec_module(mod)
          mod.PUBKEY = pathlib.Path("/tmp/ext.pub")
          manifest, payload = mod.read_package(smx)
          print("verified manifest:", manifest)
          assert manifest["id"] == "firmware"
          assert manifest["arch"] == "amd64"
          with zipfile.ZipFile(smx) as z:
              assert sorted(z.namelist()) == ["manifest.json", "manifest.sig", "payload.squashfs"]
          payload_path = pathlib.Path("/tmp/payload.squashfs")
          payload_path.write_bytes(payload)
          listing = subprocess.run(
              ["unsquashfs", "-l", str(payload_path)],
              check=True, capture_output=True, text=True,
          ).stdout
          hits = [line for line in listing.splitlines() if "/lib/firmware/" in line]
          print(f"payload firmware files: {len(hits)}")
          assert hits, "extension payload contains no /lib/firmware files"
          PY

      - name: Install smthctl and the test trust key
        shell: bash
        run: |
          set -euo pipefail
          install -D -m 755 config/includes.chroot_after_packages/usr/local/bin/smthctl /usr/local/bin/smthctl
          install -D -m 644 /tmp/ext.pub /etc/smth/extensions.pub

      - name: Reject tampered, wrong-arch and unsigned packages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, shutil, subprocess, zipfile
          smx = next(pathlib.Path("/tmp/ext").glob("firmware-amd64.smx"))
          work = pathlib.Path("/tmp/tamper")
          work.mkdir(exist_ok=True)

          def rewrite(name, manifest, payload, signature=None):
              with zipfile.ZipFile(smx) as z:
                  old_sig = z.read("manifest.sig")
              out = work / name
              with zipfile.ZipFile(out, "w") as z:
                  z.writestr("manifest.json", json.dumps(manifest))
                  z.writestr("manifest.sig", signature if signature is not None else old_sig)
                  z.writestr("payload.squashfs", payload)
              return out

          with zipfile.ZipFile(smx) as z:
              manifest = json.loads(z.read("manifest.json"))
              payload = z.read("payload.squashfs")
          tampered = rewrite("tampered.smx", manifest, payload[:-1] + bytes([payload[-1] ^ 1]))
          wrong = dict(manifest, arch="arm64")
          wrong_path = work / "wrong.smx"
          manifest_path = work / "manifest.json"
          manifest_path.write_text(json.dumps(wrong))
          sig_path = work / "manifest.sig"
          subprocess.run(["openssl", "dgst", "-sha256", "-sign", "/tmp/ext.key",
                          "-out", str(sig_path), str(manifest_path)], check=True)
          rewrite("wrong.smx", wrong, payload, sig_path.read_bytes())
          for label, package in (("tampered", tampered), ("wrong-arch", wrong_path)):
              result = subprocess.run(["smthctl", "extension", "verify", str(package)],
                                      capture_output=True, text=True)
              print(label, "exit", result.returncode, result.stdout.strip(), result.stderr.strip())
              assert result.returncode != 0, f"{label} package was accepted"
          saved = pathlib.Path("/etc/smth/extensions.pub").read_bytes()
          pathlib.Path("/etc/smth/extensions.pub").unlink()
          try:
              result = subprocess.run(["smthctl", "extension", "verify", str(smx)],
                                      capture_output=True, text=True)
              print("missing-key exit", result.returncode, result.stderr.strip())
              assert result.returncode != 0, "package accepted without a trusted key"
          finally:
              pathlib.Path("/etc/smth/extensions.pub").write_bytes(saved)
          PY

      - name: Install, mount, activate and remove the firmware extension
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /var/lib/smth/extensions /opt/smth/extensions /usr/local/share/applications
          # A privileged container has the kernel loop driver but may not have
          # the device nodes; create the standard nodes rather than skipping mount.
          [ -e /dev/loop-control ] || mknod /dev/loop-control c 10 237
          for i in $(seq 0 7); do [ -e "/dev/loop$i" ] || mknod "/dev/loop$i" b 7 "$i"; done
          SMX=/tmp/ext/firmware-amd64.smx
          smthctl extension verify "$SMX"
          smthctl extension install "$SMX"
          mountpoint -q /opt/smth/extensions/firmware
          test -f /var/lib/smth/extensions/firmware/payload.squashfs
          count=$(find /opt/smth/extensions/firmware -path '*/lib/firmware/*' -type f | wc -l)
          echo "firmware files visible after mount: $count"
          test "$count" -gt 0
          smthctl extension list | grep -q '^firmware[[:space:]]'
          smthctl extension remove firmware
          ! mountpoint -q /opt/smth/extensions/firmware
          test ! -e /opt/smth/extensions/firmware
          test ! -e /var/lib/smth/extensions/firmware
          # Recovery path: reinstall, then use the same activation routine the
          # boot unit uses.
          smthctl extension install "$SMX"
          smthctl extension activate-all
          mountpoint -q /opt/smth/extensions/firmware
          count=$(find /opt/smth/extensions/firmware -path '*/lib/firmware/*' -type f | wc -l)
          echo "firmware files visible after re-activation: $count"
          test "$count" -gt 0
          smthctl extension remove firmware
          ! mountpoint -q /opt/smth/extensions/firmware
          echo "PASS extension: verified, mounted, firmware visible, removed, reinstalled, activated and removed"

  release:
    name: Release verified artifacts
    # Publishing happens only for version tags, and only if every ISO built.
    if: startsWith(github.ref, 'refs/tags/v')
    # A release is published only after both ISO builds, both boot checks and
    # the real extension install/mount/remove job have passed.
    needs: [iso, boot, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify every artifact before publishing
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            test -s "dist/smth-os-$arch.iso" || { echo "missing $arch ISO"; exit 1; }
            test -s "dist/smth-os-$arch.iso.sha256" || echo "note: per-file checksum absent for $arch"
          done
          cd dist
          sha256sum smth-os-*.iso > SHA256SUMS
          sha256sum -c SHA256SUMS
          ls -lh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
