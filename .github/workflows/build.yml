name: Build SMTH OS

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: smth-os-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    name: ISO (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }   # native ARM runner, no emulation
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    container:
      # Public mirror of the Docker Hub library image: anonymous pulls of
      # debian:trixie on shared runners get rate limited, which killed the job
      # during container start-up before any step ran.
      image: public.ecr.aws/docker/library/debian:trixie
      options: --privileged
    steps:
      # The debian image has no git, so checkout cannot run inside it yet.
      - name: Prepare container (git for checkout)
        shell: bash
        run: |
          set +e
          log=/tmp/prep.log
          : > "$log"
          apt-get update >> "$log" 2>&1
          update_status=$?
          apt-get install -y --no-install-recommends git ca-certificates >> "$log" 2>&1
          install_status=$?
          cat "$log"
          echo "apt-get update exit: $update_status, install exit: $install_status"
          if [ $update_status -ne 0 ] || [ $install_status -ne 0 ]; then
            # Annotations are readable without an account, raw logs are not.
            detail=$(tail -c 2500 "$log" | tr '\n' ' ' | tr -s ' ')
            detail=${detail//\%/pct}
            echo "::error title=Container preparation failed::update=$update_status install=$install_status :: $detail"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Build ISO (${{ matrix.arch }})
        shell: bash
        run: |
          set +e
          SMTH_ARCH=${{ matrix.arch }} bash scripts/build.sh 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            # Keep the END of the log: the failing command is the last thing logged.
            # The raw tail is full of carriage returns and percents, which mangles
            # annotations, so report the stage markers instead.
            stages=$(tr -d '\r' < /tmp/build.log | grep -a '^STAGE:' | tail -6 | tr '\n' ';' | tr -s ' ')
            # Raw logs require an account even for public repositories; put the
            # end of the log in the annotation so the failure is diagnosable.
            tail_detail=$(tr -d '\r' < /tmp/build.log | tail -c 3000 | tr '\n' ' ' | tr -s ' ')
            tail_detail=${tail_detail//\%/pct}
            echo "::error title=ISO build failed (${{ matrix.arch }}) exit $status::last stages: $stages || log tail: $tail_detail"
            if [ -f /tmp/build.log ]; then
              cp /tmp/build.log "/tmp/build-${{ matrix.arch }}.log" || true
            fi
            exit $status
          fi
      - name: Keep the build log when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.arch }}
          path: /tmp/build-${{ matrix.arch }}.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify ISO and checksum
        run: |
          set -euo pipefail
          ISO=out/smth-os-${{ matrix.arch }}.iso
          test -s "$ISO"
          test "$(stat -c%s "$ISO")" -gt 100000000
          ( cd out && sha256sum -c SHA256SUMS )
      - name: Report ISO size
        run: |
          ISO=out/smth-os-${{ matrix.arch }}.iso
          bytes=$(stat -c%s "$ISO")
          echo "::notice title=ISO size (${{ matrix.arch }})::$bytes bytes ($(du -h "$ISO" | cut -f1))"
      - uses: actions/upload-artifact@v4
        with:
          name: smth-os-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  extension:
    name: Firmware extension (test-signed)
    # Builds the real firmware extension from the Trixie archive with an
    # ephemeral key. This verifies the builder and the verifier without
    # touching the production signing key or publishing an artifact.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: public.ecr.aws/docker/library/debian:trixie
      options: --privileged
    steps:
      - name: Prepare container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates debootstrap squashfs-tools openssl debian-archive-keyring
      - uses: actions/checkout@v4
      - name: Build the firmware extension with a test key
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/ext.key
          openssl rsa -in /tmp/ext.key -pubout -out /tmp/ext.pub
          python3 tools/build_extension.py firmware --arch amd64 \
            --private-key /tmp/ext.key --out /tmp/ext
          ls -lh /tmp/ext
      - name: Verify the extension with smthctl and inspect the payload
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.machinery, importlib.util, pathlib, subprocess, zipfile

          smx = next(pathlib.Path("/tmp/ext").glob("firmware-amd64.smx"))
          loader = importlib.machinery.SourceFileLoader(
              "smthctl_under_test",
              "config/includes.chroot_after_packages/usr/local/bin/smthctl",
          )
          spec = importlib.util.spec_from_loader(loader.name, loader)
          mod = importlib.util.module_from_spec(spec)
          loader.exec_module(mod)
          mod.PUBKEY = pathlib.Path("/tmp/ext.pub")
          manifest, payload = mod.read_package(smx)
          print("verified manifest:", manifest)
          assert manifest["id"] == "firmware"
          assert manifest["arch"] == "amd64"
          with zipfile.ZipFile(smx) as z:
              assert sorted(z.namelist()) == ["manifest.json", "manifest.sig", "payload.squashfs"]
          payload_path = pathlib.Path("/tmp/payload.squashfs")
          payload_path.write_bytes(payload)
          listing = subprocess.run(
              ["unsquashfs", "-l", str(payload_path)],
              check=True, capture_output=True, text=True,
          ).stdout
          hits = [line for line in listing.splitlines() if "/lib/firmware/" in line]
          print(f"payload firmware files: {len(hits)}")
          assert hits, "extension payload contains no /lib/firmware files"
          PY

  release:
    name: Release verified artifacts
    # Publishing happens only for version tags, and only if every ISO built.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: iso
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify every artifact before publishing
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            test -s "dist/smth-os-$arch.iso" || { echo "missing $arch ISO"; exit 1; }
            test -s "dist/smth-os-$arch.iso.sha256" || echo "note: per-file checksum absent for $arch"
          done
          cd dist
          sha256sum smth-os-*.iso > SHA256SUMS
          sha256sum -c SHA256SUMS
          ls -lh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
