name: Build SMTH launchers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'launchers/**'
      - '.github/workflows/launchers.yml'
    tags: ['launcher-v*']

permissions:
  contents: read

concurrency:
  group: smth-launchers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android launcher
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build Android launcher
        working-directory: launchers/android
        run: gradle --no-daemon assembleDebug
      - name: Verify APK integrity, identity and contents
        run: |
          set -euo pipefail
          APK=launchers/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          test "$(stat -c%s "$APK")" -gt 100000
          unzip -t "$APK"
          unzip -l "$APK" | grep -E 'classes(2)?\.dex'
          unzip -l "$APK" | grep -E 'res/font/(space_mono|doto)' || { echo "bundled fonts missing from APK"; exit 1; }
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='os.smth.launcher'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "launchable-activity: name='os.smth.launcher.MainActivity'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
      - name: Name Android package
        run: cp launchers/android/app/build/outputs/apk/debug/app-debug.apk launchers/android/SMTH-Android-Launcher.apk
      # Publish immediately after build/integrity checks. Emulator availability
      # must never delay or prevent users from retrieving a valid APK.
      - uses: actions/upload-artifact@v4
        with:
          name: SMTH-Android-Launcher
          path: launchers/android/SMTH-Android-Launcher.apk
          if-no-files-found: error
          retention-days: 30
      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # Newer emulator builds reject -accel off unless TCG is explicitly enabled.
          ANDROID_I_WANT_MY_TCG: 'yes'
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: bash launchers/android/ci-emulator-test.sh launchers/android/SMTH-Android-Launcher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SMTH-Android-Screenshot
          path: launchers/android/smth-launcher-*.png
          if-no-files-found: warn
          retention-days: 30

  windows:
    name: Windows launcher
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build portable Windows launcher
        working-directory: launchers/windows
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python generate_icon.py
          pyinstaller --noconfirm --clean --onefile --windowed --name SMTH-Launcher `
            --icon assets/smth-black.ico --add-data "assets;assets" smth_launcher.py
      - name: Smoke test the executable
        shell: pwsh
        working-directory: launchers/windows
        run: |
          $exe = "dist\SMTH-Launcher.exe"
          if (-not (Test-Path $exe)) { throw "EXE not produced" }
          if ((Get-Item $exe).Length -lt 1000000) { throw "EXE is implausibly small" }
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "Launcher exited immediately with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host "Launcher stayed running for 8 seconds"
      - uses: actions/upload-artifact@v4
        with:
          name: SMTH-Windows-Launcher
          path: launchers/windows/dist/SMTH-Launcher.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release launchers
    # Only tagged launcher releases are published, never every push to main.
    if: startsWith(github.ref, 'refs/tags/launcher-v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Verify release packages and generate checksums
        run: |
          set -euo pipefail
          test -s dist/SMTH-Android-Launcher.apk
          test -s dist/SMTH-Launcher.exe
          unzip -t dist/SMTH-Android-Launcher.apk
          unzip -l dist/SMTH-Android-Launcher.apk | grep -E 'classes(2)?\.dex'
          cd dist
          sha256sum SMTH-Android-Launcher.apk SMTH-Launcher.exe > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: SMTH Launchers ${{ github.ref_name }}
          generate_release_notes: true
