name: Build SMTH launchers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'launchers/**'
      - '.github/workflows/launchers.yml'
    tags: ['launcher-v*']
permissions:
  contents: write
concurrency:
  group: smth-launchers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build Android launcher
        working-directory: launchers/android
        run: gradle --no-daemon assembleDebug
      - name: Verify Android APK contents
        run: |
          APK=launchers/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          test "$(stat -c%s "$APK")" -gt 100000
          unzip -t "$APK"
          unzip -l "$APK" | grep -E 'classes(2)?\.dex' 
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='os.smth.launcher'"
      - name: Name Android package
        run: cp launchers/android/app/build/outputs/apk/debug/app-debug.apk launchers/android/SMTH-Android-Launcher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SMTH-Android-Launcher
          path: launchers/android/SMTH-Android-Launcher.apk
          if-no-files-found: error
          retention-days: 30
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build portable Windows launcher
        working-directory: launchers/windows
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pyinstaller --noconfirm --clean --onefile --windowed --name SMTH-Launcher smth_launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: SMTH-Windows-Launcher
          path: launchers/windows/dist/SMTH-Launcher.exe
          if-no-files-found: error
          retention-days: 30
  release:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/launcher-v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Generate checksums
        run: cd dist && sha256sum *.apk *.exe > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: launcher-v1.0.0
          target_commitish: main
          name: SMTH Launchers v1.0.0
          make_latest: true
          generate_release_notes: true
