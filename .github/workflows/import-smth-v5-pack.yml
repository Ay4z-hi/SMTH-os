name: Import SMTH v5 pack

on:
  push:
    branches: [main]
    paths:
      - "smth-v5-pack.zip"

permissions:
  contents: write

jobs:
  extract-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract pack without deleting existing files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from shutil import copyfileobj

          archive = Path("smth-v5-pack.zip")
          root = Path.cwd().resolve()
          if not archive.is_file():
              raise SystemExit("smth-v5-pack.zip was not found")

          with ZipFile(archive) as zf:
              for item in zf.infolist():
                  rel = Path(item.filename)
                  if rel.is_absolute() or ".." in rel.parts:
                      raise SystemExit(f"Unsafe ZIP path: {item.filename}")
                  target = (root / rel).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f"Unsafe ZIP path: {item.filename}")
                  if item.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with zf.open(item) as src, target.open("wb") as dst:
                      copyfileobj(src, dst)

          print("Extracted pack. Existing repository files not present in the ZIP were left untouched.")
          PY

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted file changes to commit."
          else
            git commit -m "Import SMTH v5 pack"
            git push
          fi
