name: SMTH checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smth-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Rust core (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Formatting
        working-directory: core
        run: cargo fmt --all -- --check
      - name: Lints (warnings are errors)
        working-directory: core
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        working-directory: core
        run: cargo test --workspace --locked

  repository:
    name: Packaged files (palette, wiring, scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image-build helpers
        run: python -m pip install --upgrade pip pillow numpy
      - name: Package names exist in Debian Trixie
        run: bash scripts/check-packages.sh
      - name: Shell syntax
        run: |
          for script in scripts/build.sh auto/build auto/clean auto/config config/hooks/normal/*.chroot tools/*.sh; do
            bash -n "$script"
          done
      - name: Generate runtime tokens and artwork
        run: |
          python3 tools/gen_tokens.py
          python3 tools/gen_assets.py config/includes.chroot_after_packages
          python3 tools/gen_cursor.py config/includes.chroot_after_packages
      - name: Palette, artwork and offline fonts
        run: python3 tools/test_palette.py
      - name: Desktop entry / taskbar / keybind wiring
        run: python3 tools/check_wiring.py
      - name: Startup timeline
        run: python3 tools/test_startup.py
      - name: AHIAN takeover timeline
        run: python3 tools/test_ahian_startup.py
      - name: AHIAN renderer frames (all three platforms)
        run: python3 tools/test_ahian_renderers.py
      - name: AHIAN flowing wallpaper
        run: python3 tools/test_ahian_flow.py
      - name: Desktop grid placement
        run: python3 tools/test_desktop_grid.py
      - name: Generated tokens are committed
        run: |
          git diff --exit-code -- \
            config/includes.chroot_after_packages/usr/local/lib/smth/palette.json \
            config/includes.chroot_after_packages/etc/skel/.config/gtk-4.0/smth-tokens.css \
            config/includes.chroot_after_packages/etc/skel/.config/gtk-4.0/smth-typography.css

  launchers:
    name: Launcher sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install launcher source helpers
        run: python -m pip install --upgrade pillow
      - name: Compile Python desktop and launcher sources
        run: |
          python3 -m py_compile launchers/windows/smth_launcher.py launchers/windows/generate_icon.py
          python3 -m py_compile config/includes.chroot_after_packages/usr/local/lib/smth/home.py
          python3 -m py_compile config/includes.chroot_after_packages/usr/local/lib/smth/ahian_startup.py
          python3 -m py_compile config/includes.chroot_after_packages/usr/local/lib/smth/ahian_startup_model.py
          python3 -m py_compile config/includes.chroot_after_packages/usr/local/lib/smth/ahian_scene.py
          python3 -m py_compile config/includes.chroot_after_packages/usr/local/lib/smth/startup.py
          python3 -m py_compile config/includes.chroot_after_packages/usr/local/bin/smth-terminal
          python3 -m py_compile config/includes.chroot_after_packages/usr/local/bin/ahian
      - name: Generate Windows black-backed application icon
        working-directory: launchers/windows
        run: |
          python generate_icon.py
          test -s assets/smth-black.ico
      - name: Windows launcher parses
        run: python3 -m py_compile launchers/windows/smth_launcher.py
      - name: Android sources are complete
        run: |
          test -f launchers/android/app/src/main/kotlin/os/smth/launcher/MainActivity.kt
          test -f launchers/android/app/src/main/res/font/space_mono.ttf
          test -f launchers/android/app/src/main/res/font/doto.ttf
          test -f launchers/android/app/src/main/res/drawable/ic_launcher_black.xml
          grep -q 'os.smth.launcher' launchers/android/app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android launcher
        working-directory: launchers/android
        run: gradle --no-daemon assembleDebug
