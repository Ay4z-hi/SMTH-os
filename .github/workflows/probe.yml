name: probe
on: push
permissions:
  contents: read
jobs:
  plain:
    runs-on: ubuntu-latest
    steps:
      - name: plain
        run: |
          echo "plain runner: $(uname -m)" >> "$GITHUB_STEP_SUMMARY"
  dockerhub_plain:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: dockerhub plain
        run: |
          echo "dockerhub no-privileged: $(head -1 /etc/os-release)" >> "$GITHUB_STEP_SUMMARY"
  dockerhub_privileged:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - name: dockerhub privileged
        run: |
          echo "dockerhub privileged: $(head -1 /etc/os-release)" >> "$GITHUB_STEP_SUMMARY"
  ecr_privileged:
    runs-on: ubuntu-latest
    container:
      image: public.ecr.aws/docker/library/debian:trixie
      options: --privileged
    steps:
      - name: ecr privileged
        run: |
          echo "ecr privileged: $(head -1 /etc/os-release)" >> "$GITHUB_STEP_SUMMARY"
