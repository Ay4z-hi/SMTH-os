name: probe
on: push
permissions:
  contents: read
jobs:
  container_deps:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - name: deps
        shell: bash
        run: |
          set +e
          log=/tmp/deps.log
          : > "$log"
          apt-get update >> "$log" 2>&1
          echo "update_exit=$?" >> "$log"
          apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso squashfs-tools mtools dosfstools \
            cargo rustc rustfmt clippy ca-certificates debian-archive-keyring \
            python3-numpy python3-pil fonts-dejavu-core \
            grub-efi-amd64-bin grub-pc-bin syslinux syslinux-common isolinux >> "$log" 2>&1
          echo "install_exit=$?" >> "$log"
          {
            echo '### container dependency install'
            echo '```'
            tail -50 "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
  summary_on_failure:
    runs-on: ubuntu-latest
    steps:
      - name: fail after writing a summary
        shell: bash
        run: |
          echo '### summary written before a failure' >> "$GITHUB_STEP_SUMMARY"
          exit 100
