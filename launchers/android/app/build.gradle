plugins {
    id 'com.android.application' version '8.7.3'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'os.smth.launcher'
    compileSdk 35
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    defaultConfig {
        applicationId 'os.smth.launcher'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
}
